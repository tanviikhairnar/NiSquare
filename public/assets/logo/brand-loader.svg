<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <style>
      @keyframes niPulse {
        0%, 100% { transform: scale(0.96); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 8px rgba(185, 154, 102, 0.7)); }
      }
      @keyframes niSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ni-ring {
        transform-origin: 80px 80px;
        animation: niSpin 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .ni-emblem {
        transform-origin: 80px 80px;
        animation: niPulse 2.2s ease-in-out infinite;
      }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#861F32" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#B99A66" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#B99A66" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <circle class="ni-ring" cx="80" cy="80" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="120 280" stroke-linecap="round" />
  <g class="ni-emblem">
    <image href="data:image/png;base64," x="35" y="35" width="90" height="90" />
  </g>
</svg>